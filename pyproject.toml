[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-attn-triton"
version = "0.1.0"
description = "FlashAttention-2 forward and backward kernels written in Triton"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.4",
    "triton>=3.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "numpy"]
bench = ["matplotlib", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmarks", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
